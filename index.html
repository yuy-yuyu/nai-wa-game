<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8bd6df"><title>奶娃</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;touch-action:none;user-select:none;background:#101820;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{position:relative;width:min(100vw,520px);height:100%;margin:auto;overflow:hidden;background:#9eb7c7;box-shadow:0 0 80px #0008}canvas{display:block;width:100%;height:100%}.topbar{position:absolute;inset:max(20px,env(safe-area-inset-top)) 20px auto;display:flex;justify-content:space-between;pointer-events:none}.pill{padding:9px 14px;border:1px solid #ffffff30;border-radius:12px;background:#13232db8;color:#f5f2e9;font-size:13px;font-weight:600;letter-spacing:.03em;box-shadow:0 8px 24px #10202b24;backdrop-filter:blur(12px)}#score{position:absolute;top:max(76px,calc(env(safe-area-inset-top) + 60px));left:50%;transform:translateX(-50%);font-size:clamp(48px,14vw,70px);font-weight:300;line-height:1;text-shadow:0 3px 15px #13232d70;pointer-events:none}.panel{position:absolute;inset:0;display:grid;place-items:center;padding:28px;background:linear-gradient(#1c314526,#10182070);backdrop-filter:blur(2px)}.card{width:min(100%,360px);padding:32px 26px 26px;border:1px solid #ffffff38;border-radius:22px;background:#13232de8;color:#f5f2e9;text-align:center;box-shadow:0 24px 70px #09121a70;backdrop-filter:blur(18px)}.bird{display:inline-block;width:90px;height:90px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 10px 10px #0005);animation:bob 1.5s ease-in-out infinite}h1{margin:0;font-size:clamp(36px,10vw,48px);font-weight:500;line-height:1;letter-spacing:.08em}.tagline{margin:14px 0 26px;color:#bdc9ce;font-size:14px;font-weight:400}button{width:100%;min-height:54px;border:1px solid #efd475;border-radius:12px;background:#d9b84f;color:#17242a;font:inherit;font-size:16px;font-weight:700;box-shadow:0 8px 24px #0003;cursor:pointer}button:active{transform:translateY(2px);box-shadow:0 4px 12px #0003}.hint{margin:18px 0 0;color:#8fa0a8;font-size:12px;font-weight:400}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.result{padding:13px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0d}.result small{display:block;color:#96a8af;font-weight:400}.result strong{font-size:30px;font-weight:500}[hidden]{display:none!important}@keyframes bob{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.bird{animation:none}}
</style></head><body><main aria-label="奶娃游戏区"><canvas id="game" aria-label="点击屏幕让奶娃飞过水管"></canvas><div class="topbar"><div class="pill">奶娃</div><div class="pill">最佳 · <span id="best">0</span></div></div><div id="score" hidden>0</div>
<section class="panel" id="start"><div class="card"><img class="bird" src="assets/flying-bird.png" alt=""><h1>奶娃</h1><p class="tagline">穿过水管，看看你能飞多远</p><button id="startButton">开始游戏</button><p class="hint">轻触屏幕 / 按空格键向上飞</p></div></section>
<section class="panel" id="over" hidden><div class="card"><h1>撞到啦！</h1><div class="results"><div class="result"><small>本次得分</small><strong id="finalScore">0</strong></div><div class="result"><small>最佳成绩</small><strong id="finalBest">0</strong></div></div><button id="restartButton">再来一次</button><p class="hint">失败没关系，下一次会飞得更远</p></div></section></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),startPanel=document.querySelector('#start'),overPanel=document.querySelector('#over'),scoreLabel=document.querySelector('#score'),bestLabel=document.querySelector('#best'),birdSprite=new Image(),background=new Image();birdSprite.src='assets/flying-bird.png';background.src='assets/comic-sky.png';birdSprite.onload=background.onload=()=>draw();let width,height,floor,bird,pipes,score,running=false,last=0,spawn=0,best=Number(localStorage.getItem('feifei-best'))||0;bestLabel.textContent=best;
function resize(){const scale=Math.min(devicePixelRatio,2);width=canvas.clientWidth;height=canvas.clientHeight;floor=height-Math.max(88,height*.12);canvas.width=width*scale;canvas.height=height*scale;ctx.setTransform(scale,0,0,scale,0,0);if(bird)bird.x=width*.28}
function reset(){bird={x:width*.28,y:height*.42,vy:0};pipes=[];score=0;spawn=0;last=performance.now();scoreLabel.textContent='0';scoreLabel.hidden=false}
function startGame(){reset();running=true;startPanel.hidden=true;overPanel.hidden=true;requestAnimationFrame(loop)}
function flap(){if(running)bird.vy=-390}
function finish(){running=false;best=Math.max(best,score);localStorage.setItem('feifei-best',best);bestLabel.textContent=best;document.querySelector('#finalScore').textContent=score;document.querySelector('#finalBest').textContent=best;scoreLabel.hidden=true;overPanel.hidden=false}
function addPipe(){const gap=Math.max(170,Math.min(220,height*.28)),margin=72,center=margin+gap/2+Math.random()*(floor-gap-margin*2);pipes.push({x:width+45,center,gap,scored:false})}
function update(dt){bird.vy+=1120*dt;bird.y+=bird.vy*dt;spawn+=dt;if(spawn>1.65){spawn=0;addPipe()}const body={x:bird.x+2,y:bird.y+6,rx:15,ry:24};for(const pipe of pipes){pipe.x-=168*dt;if(!pipe.scored&&pipe.x+34<bird.x){pipe.scored=true;score++;scoreLabel.textContent=score}const dx=Math.max(pipe.x-34-body.x,0,body.x-(pipe.x+34));if(dx<body.rx){const edge=body.ry*Math.sqrt(1-(dx/body.rx)**2),hitsGap=body.y-edge<pipe.center-pipe.gap/2||body.y+edge>pipe.center+pipe.gap/2;if(hitsGap)return finish()}}pipes=pipes.filter(pipe=>pipe.x>-50);if(body.y+body.ry>=floor||body.y-body.ry<=0)finish()}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke()}
function draw(){if(background.complete&&background.naturalWidth){const scale=Math.max(width/background.naturalWidth,height/background.naturalHeight),w=background.naturalWidth*scale,h=background.naturalHeight*scale;ctx.drawImage(background,(width-w)/2,(height-h)/2,w,h)}else{ctx.fillStyle='#4d8fc1';ctx.fillRect(0,0,width,height)}for(const pipe of pipes){const top=pipe.center-pipe.gap/2,bottom=pipe.center+pipe.gap/2,stone=ctx.createLinearGradient(pipe.x-34,0,pipe.x+34,0);stone.addColorStop(0,'#173f3d');stone.addColorStop(.18,'#39796c');stone.addColorStop(.48,'#72ad8e');stone.addColorStop(.7,'#39796c');stone.addColorStop(1,'#153431');ctx.fillStyle=stone;ctx.strokeStyle='#102a2b';ctx.lineWidth=3;roundedRect(pipe.x-27,-12,54,top+12,4);roundedRect(pipe.x-34,top-20,68,20,3);roundedRect(pipe.x-27,bottom,54,floor-bottom+12,4);roundedRect(pipe.x-34,bottom,68,20,3);ctx.fillStyle='#b6d69b55';ctx.fillRect(pipe.x-15,0,7,Math.max(0,top-20));ctx.fillRect(pipe.x-15,bottom+20,7,Math.max(0,floor-bottom-20));ctx.fillStyle='#0b292b88';ctx.fillRect(pipe.x+17,0,8,Math.max(0,top-20));ctx.fillRect(pipe.x+17,bottom+20,8,Math.max(0,floor-bottom-20))}const land=ctx.createLinearGradient(0,floor,0,height);land.addColorStop(0,'#24453dcc');land.addColorStop(1,'#10251fee');ctx.fillStyle=land;ctx.fillRect(0,floor,width,height-floor);ctx.fillStyle='#d6b667';ctx.fillRect(0,floor,width,3);if(bird&&birdSprite.complete){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.35,Math.min(.8,bird.vy/700)));ctx.shadowColor='#132d3c80';ctx.shadowBlur=12;ctx.drawImage(birdSprite,-37,-37,74,74);ctx.restore()}}
function loop(now){if(!running)return draw();const dt=Math.min((now-last)/1000,.03);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
document.querySelector('#startButton').addEventListener('click',startGame);document.querySelector('#restartButton').addEventListener('click',startGame);canvas.addEventListener('pointerdown',flap);addEventListener('keydown',event=>{if(event.code==='Space'||event.code==='ArrowUp'){event.preventDefault();flap()}});addEventListener('resize',()=>{resize();draw()});resize();reset();scoreLabel.hidden=true;draw();
</script></body></html>
